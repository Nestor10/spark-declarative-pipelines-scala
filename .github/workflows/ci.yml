name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # Aggregated: compiles every module's test sources, `sdpIt` included.
      # That module's specs are SDP_INTEGRATION-gated, so compiling them here
      # needs no container engine — only running them would.
      - name: Compile
        run: sbt Test/compile

      # Module-scoped on purpose: `sdp`'s suite is structurally offline since
      # the container-backed specs moved to `sdpIt` (S1.5). `sdpIt/testFull`
      # is deliberately NOT run here — it wants podman/docker and minutes.
      - name: Library tests
        run: sbt sdp/testFull

      # The plugin's real test is the scripted suite: sandbox consumer builds
      # that publishLocal sdp + the plugin, then exercise classload-eval
      # discovery, validation, caching, and cycle detection.
      - name: Plugin scripted tests
        run: sbt sbtSparkPipelines/scripted
