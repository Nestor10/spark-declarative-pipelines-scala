name: Release

# Tag-driven (stolen from fishy-mcp, adapted to sbt 2): pushing vX.Y.Z
# publishes BOTH artifacts (sdp + sbt-spark-pipelines) to Maven Central via
# sbt-ci-release. Secrets are the same four fishy-mcp uses — the
# io.github.nestor10 namespace and PGP key are already established there.
on:
  push:
    tags:
      - "v*"

jobs:
  # A tag is not a verification. A push to a branch gets ci.yml; a tag push
  # used to get nothing but a publish — so a red tree could be released, and a
  # release to Central is immutable. This job is the gate: `publish` declares
  # `needs: verify`, and GitHub SKIPS a dependent job when its dependency
  # fails, so a failing compile/test/scripted run provably blocks the publish.
  # No secrets here — they stay confined to the publish job below.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # Aggregated compile covers the test-only `sdpIt` module too (its specs
      # are SDP_INTEGRATION-gated, so no container engine is needed to compile
      # them); the gate job runs the offline `sdp` suite, not `sdpIt`.
      - name: Compile
        run: sbt Test/compile

      - name: Library tests
        run: sbt sdp/testFull

      # Same suite ci.yml runs: sandbox consumer builds that publishLocal both
      # artifacts, then exercise discovery, validation, caching, cycles.
      - name: Plugin scripted tests
        run: sbt sbtSparkPipelines/scripted

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver needs full history to derive the version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          CI: true
        run: sbt ci-release
